AWSTemplateFormatVersion: '2010-09-09'
Description: Create VPC (10.1.0.0/16), subnets, security group, and EC2 instance

Parameters:
  SecurityGroupDescription:
    Description: Security Group Description
    Type: String

  SecurityGroupPort:
    Description: Port allowed for inbound traffic
    Type: Number
    MinValue: 1150
    MaxValue: 65535

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t2.small
    AllowedValues:
      - t1.micro
      - t2.nano
      - t2.micro
      - t2.small

  KeyName:
    Description: Existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName

  SecurityGroupIngressCIDR:
    Description: CIDR allowed to access EC2
    Type: String
    Default: 0.0.0.0/0

Resources:

  # ----------------------------
  # VPC
  # ----------------------------
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MyVPC-10.1.0.0

  # ----------------------------
  # Subnets
  # ----------------------------
  DbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.1.16.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: DbSubnet1

  DbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.1.32.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: DbSubnet2

  DbSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.1.48.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: DbSubnet3

  # ----------------------------
  # Security Group
  # ----------------------------
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Ref SecurityGroupDescription
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref SecurityGroupPort
          ToPort: !Ref SecurityGroupPort
          CidrIp: !Ref SecurityGroupIngressCIDR
      Tags:
        - Key: Name
          Value: MySecurityGroup

  # ----------------------------
  # EC2 Instance
  # ----------------------------
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: ami-00e428798e77d38d9
      SubnetId: !Ref DbSubnet1
      SecurityGroupIds:
        - !Ref MySecurityGroup
      Tags:
        - Key: Name
          Value: MyEC2Instance

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref MyVPC

  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref MyEC2Instance
